[project]
name = "trackservice"
version = "0.1.0"
description = "Maintenance block scheduling for railway engineering windows: detect conflicts, prove why, propose alternatives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
trackservice = "trackservice.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackservice"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
